name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署,新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # .gitmodules 里两个引擎子仓库(vendor/AetherChess、vendor/AetherOthello)
      # 记的是 SSH 地址,Actions 运行器没有私钥;两仓库均公开,重写成匿名
      # HTTPS 即可检出。必须在 checkout 之前配置。
      - name: 子模块地址重写(SSH → 匿名 HTTPS)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          # 引擎源码在 submodule 里,不检出则 vite build 直接失败
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # Pages 默认走 Jekyll 处理,禁用以保留全部静态资源
      - name: 禁用 Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
