<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>百度街景渲染检测</title>
<style>
  body { margin: 0; font: 13px/1.6 -apple-system, "Microsoft YaHei", sans-serif; background: #f2f4f8; }
  #pano { width: 100vw; height: 78vh; background: #11161f; }
  #log { padding: 14px 18px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="pano"></div>
<div id="log">加载中…</div>
<script>
  const AK = 'M6gP5GsIPshSgOh7JnGgnxgXlEj0gyRj';
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };

  window.__tuxun_ready = () => {
    try {
      log('BMapGL 已加载,开始拉取天安门附近街景…');
      const svc = new BMapGL.PanoramaService();
      svc.getPanoramaByLocation(new BMapGL.Point(116.397, 39.909), (data) => {
        if (!data || !(data.id || data.panoId)) { log('✗ 未找到街景数据'); return; }
        const id = data.id || data.panoId;
        log('✓ 街景元数据获取成功,panoId=' + id);
        const pano = new BMapGL.Panorama(document.getElementById('pano'));
        pano.setId(id);
        log('setId 已调用,等待图像瓦片…(8 秒后汇总网络请求)');
        setTimeout(() => {
          const reqs = performance.getEntriesByType('resource')
            .filter(r => /pcsv|apisv0|mapsv|pano|sv/i.test(r.name));
          const hosts = {};
          for (const r of reqs) { const h = r.name.split('/')[2]; hosts[h] = (hosts[h] || 0) + 1; }
          log('街景相关请求:' + JSON.stringify(hosts));
          log(Object.keys(hosts).some(h => /pcsv|mapsv/.test(h))
            ? '✓ 检测到街景图像瓦片请求,画布应已出图'
            : '✗ 未发起任何街景图像瓦片请求 —— 图像服务对该 AK 不可用(权限未同步/未开通)');
        }, 8000);
      });
    } catch (e) { log('✗ 异常:' + e.message); }
  };
  const s = document.createElement('script');
  s.src = 'https://api.map.baidu.com/api?type=webgl&v=1.0&ak=' + AK + '&callback=__tuxun_ready';
  s.onerror = () => log('✗ 百度地图脚本加载失败');
  document.head.appendChild(s);
</script>
</body>
</html>
